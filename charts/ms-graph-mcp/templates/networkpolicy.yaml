{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressFrom }}
{{- fail "Set networkPolicy.ingressFrom to allowed pod/namespace selectors" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "msgraph.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "msgraph.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- .Values.networkPolicy.ingressFrom | toYaml | nindent 8 }}
      ports:
        - port: 8000
          protocol: TCP
{{- end }}
