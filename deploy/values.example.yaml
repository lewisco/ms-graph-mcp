# Replace example IDs, hostname and image tag/digest before installation.
fullnameOverride: ms-graph-mcp
replicaCount: 2
image:
  repository: harbor.example.com/ai/ms-graph-mcp
  tag: "0.1.0-local"
imagePullSecrets:
  - name: harbor-pull
config:
  tenantId: "11111111-1111-4111-8111-111111111111"
  clientId: "22222222-2222-4222-8222-222222222222"
  allowedClientIds: ["33333333-3333-4333-8333-333333333333"]
  resourceUrl: https://litellm.example.com/msgraph/mcp
credentials:
  existingSecret: ms-graph-mcp-entra
  clientSecretKey: client-secret
transportSecurity:
  mode: tls
  existingSecret: ms-graph-mcp-tls
networkPolicy:
  enabled: true
  # Replace these with the actual gateway namespace and pod labels before deploying.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai
      podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
enterpriseCA:
  enabled: true
  configMapName: enterprise-ca
  key: enterprise-ca.pem
