# Merge into your existing LiteLLM configuration. Preserve its gateway admission policy.
# Client URL: https://<litellm-host>/msgraph/mcp
# No Entra client secret belongs in this server entry.
mcp_servers:
  msgraph:
    url: "http://ms-graph-mcp:8000/mcp"
    transport: "http"
    auth_type: "oauth_delegate"
