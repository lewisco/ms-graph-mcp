# Merge into your existing LiteLLM configuration. Preserve its gateway admission policy.
# Client URL: https://<litellm-host>/msgraph/mcp
# Trust the MCP server certificate issuer in LiteLLM; never disable verification.
# Use HTTP only with transportSecurity.mode=mesh and enforced mesh mTLS.
#
# Gateway-managed per-user OAuth (LiteLLM 1.107+). LiteLLM signs each user in once on its
# connect page, stores and refreshes their Entra token, and sends it as the upstream bearer.
# client_id/client_secret are the LiteLLM Entra client registration, never the MCP API's
# OBO credential. Add that client_id to the MCP's config.allowedClientIds.
mcp_servers:
  msgraph:
    url: "https://ms-graph-mcp.ai.svc:8000/mcp"
    transport: "http"
    auth_type: "oauth2"
    oauth2_flow: "authorization_code"
    authorization_url: "https://login.microsoftonline.com/<TENANT_ID>/oauth2/v2.0/authorize"
    token_url: "https://login.microsoftonline.com/<TENANT_ID>/oauth2/v2.0/token"
    client_id: "<LITELLM_CLIENT_ID>"
    client_secret: "os.environ/MSGRAPH_LITELLM_CLIENT_SECRET"
    scopes:
      - "api://<MCP_CLIENT_ID>/access_as_user"
      - "offline_access"
    # Leave upstream_resource unset. Entra has no RFC 8707 support and can reject a
    # resource parameter that disagrees with the requested scope (AADSTS9010010).

# Legacy: WebUI performs the Entra OAuth and forwards the user's token alongside a separate
# x-litellm-api-key. No Entra client secret belongs in this server entry.
